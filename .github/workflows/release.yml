name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            executable: timeular_reader.exe
            asset: timeular-reader-windows-x64.exe
          - os: ubuntu-22.04
            platform: linux-x64
            executable: timeular_reader
            asset: timeular-reader-linux-x64
          - os: macos-15-intel
            platform: macos-x64
            executable: timeular_reader
            asset: timeular-reader-macos-x64
          - os: macos-15
            platform: macos-arm64
            executable: timeular_reader
            asset: timeular-reader-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@1.78.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config libssl-dev
      - name: Build executable
        run: cargo build --release --locked
      - name: Upload executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXECUTABLE: ${{ matrix.executable }}
          ASSET: ${{ matrix.asset }}
        run: |
          $binary = Join-Path (Join-Path target release) $env:EXECUTABLE
          Copy-Item $binary $env:ASSET
          gh release upload "$env:RELEASE_TAG" "$env:ASSET" --clobber
